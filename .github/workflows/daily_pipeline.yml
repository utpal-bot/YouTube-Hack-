name: daily-pipeline

on:
  schedule:
    - cron: "30 2 * * *"   # 02:30 UTC daily - videos get scheduled for later slots
  workflow_dispatch:
    inputs:
      topic:
        description: "Override topic (optional)"
        required: false
        default: ""
      dry_run:
        description: "true = no YouTube upload, no commit"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: daily-pipeline
  cancel-in-progress: false

env:
  DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '0' }}
  TOPIC: ${{ github.event.inputs.topic }}
  NICHE: ${{ vars.NICHE }}
  VOICE: ${{ vars.VOICE }}
  LANGUAGE: ${{ vars.LANGUAGE }}          # e.g. Hinglish
  HINGLISH_MODE: ${{ vars.HINGLISH_MODE }}  # devanagari (default) | roman

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Cache HuggingFace model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-minilm-v1

      - name: System deps
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-liberation

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Topic -> script -> voice -> images
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: python pipeline.py prepare

      - uses: actions/upload-artifact@v4
        with:
          name: build
          path: build/
          retention-days: 2
          if-no-files-found: error

  render:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        target: [long, short1, short2, short3]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: System deps
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-liberation

      - name: Render needs only Pillow
        run: pip install Pillow

      - uses: actions/download-artifact@v4
        with:
          name: build
          path: build

      - name: Render ${{ matrix.target }}
        run: python pipeline.py render --target ${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: out-${{ matrix.target }}
          path: out/
          retention-days: 2
          if-no-files-found: error

  upload:
    needs: render
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upload deps
        run: pip install google-api-python-client google-auth google-auth-oauthlib

      - uses: actions/download-artifact@v4
        with:
          name: build
          path: build

      - uses: actions/download-artifact@v4
        with:
          pattern: out-*
          merge-multiple: true
          path: out

      - name: Upload + schedule on YouTube (private + publishAt)
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          PUBLISH_SLOTS_UTC: ${{ vars.PUBLISH_SLOTS_UTC }}
          YT_CATEGORY_ID: ${{ vars.YT_CATEGORY_ID }}
        run: python upload.py

      - name: Record topic in used_topics.json
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          python dedupe.py commit
          git config user.name "pipeline-bot"
          git config user.email "pipeline-bot@users.noreply.github.com"
          git add used_topics.json
          git diff --cached --quiet || (git commit -m "chore: record topic" && git pull --rebase && git push)
